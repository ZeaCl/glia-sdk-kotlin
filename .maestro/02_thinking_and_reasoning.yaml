appId: cl.zea.glia.sample
---
- launchApp:
    clearState: true

- tapOn:
    id: "chat_input"
- inputText: "Analyze architecture"
- hideKeyboard
- tapOn:
    id: "send_button"

# Wait for reasoning process to be visible
- extendedWaitUntil:
    visible: "Reasoning Process"
    timeout: 10000

- assertVisible: "Reasoning Process"

# Tap on reasoning block to expand
- tapOn: "Reasoning Process"
- assertVisible: ".*Analyzing your request.*"

# Tap again to collapse
- tapOn: "Reasoning Process"
