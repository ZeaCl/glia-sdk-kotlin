appId: cl.zea.glia.sample
---
- launchApp:
    clearState: true

# Turn 1: First user query
- tapOn:
    id: "chat_input"
- inputText: "Turn 1: What is Glia?"
- tapOn:
    id: "send_button"

# Wait for Turn 1 response to complete
- assertVisible: "Turn 1: What is Glia?"
- assertVisible: "Glia AI Assistant"

# Turn 2: Follow-up query
- tapOn:
    id: "chat_input"
- inputText: "Turn 2: Explain providers"
- tapOn:
    id: "send_button"

# Acceptance Criteria: Both Turn 1 and Turn 2 messages are preserved in chronological order
- assertVisible: "Turn 1: What is Glia?"
- assertVisible: "Turn 2: Explain providers"
- assertVisible:
    id: "assistant_message"
