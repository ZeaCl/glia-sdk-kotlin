version: "1.0"
domain: "sdk"

profile:
  id: "glia_sdk_kotlin_sdk_android"
  name: "glia-sdk-kotlin Android Client SDK Security Profile"
  description: "Native Android client SDK / library (.aar)."
  target_artifact: "android/glia-sdk-kotlin.aar"
  type: "sdk_android"
  platform: "google_android"

layers:
  client_network:
    network_security_config_enforced: true
    cleartext_traffic_permitted: false
    certificate_pinning: true

  client_storage:
    credentials_storage: "encrypted_shared_preferences"
    database_encryption: "sqlcipher"

  binary_hardening:
    r8_full_mode: true

compliance:
  frameworks:
    - "OWASP_MASVS_L2"
    - "GOOGLE_PLAY_DATA_SAFETY"
    - "LEY_21719_APDP"

rules:
  - "Network Security Config: Cleartext traffic strictly disabled"
  - "Storage: Sensitive tokens encrypted using EncryptedSharedPreferences (Android Keystore)"
