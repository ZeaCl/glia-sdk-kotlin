version: "3.0"
id: "android_security_audit"
name: "Auditoría de Seguridad Cliente Android (OWASP MASVS L2)"
description: "Verificación de transporte seguro WSS, ausencia de tokens en URLs, protección de secrets y almacenamiento seguro."

stages:
  - name: "Validación de Transporte Seguro (WSS & HTTPS)"
    steps:
      - id: "enforce_https"
        name: "Prohibir endpoints HTTP no cifrados"
        pattern_scan:
          paths: ["**/*.kt", "**/*.java"]
          exclude: ["**/test/**", "**/androidTest/**"]
          forbid_regex: '["'']http://'
          message: "Endpoint HTTP inseguro detectado en código de producción"
      - id: "enforce_wss"
        name: "Prohibir WebSockets sin cifrado TLS (ws://)"
        pattern_scan:
          paths: ["**/*.kt", "**/*.java"]
          exclude: ["**/test/**", "**/androidTest/**"]
          forbid_regex: '["'']ws://'
          message: "WebSocket sin cifrado (ws://) detectado en código de producción"
      - id: "no_token_in_query"
        name: "Prohibir paso de tokens de autenticación por URL Query String"
        pattern_scan:
          paths: ["**/*.kt", "**/*.java"]
          exclude: ["**/test/**", "**/androidTest/**"]
          forbid_regex: '(?i)([?&](token|access_token|auth_token)=|queryParams\.(add|set|put)\(["''](token|access_token))'
          message: "Token de autenticación expuesto en Query String (OWASP M1)"
  - name: "Inspección de Secretos y API Keys"
    steps:
      - id: "no_secrets"
        name: "Prohibir llaves maestras o API keys hardcodeadas"
        pattern_scan:
          paths: ["**/*.kt", "**/*.java"]
          exclude: ["**/test/**", "**/androidTest/**"]
          forbid_regex: '(?i)(api[_-]?key|secret[_-]?key)\s*[:=]\s*["''][A-Za-z0-9_\-]{20,}["'']'
          message: "Posible API Key o secreto embebido detectado en código"
  - name: "Auditoría Criptográfica y de Almacenamiento"
    steps:
      - id: "no_weak_crypto"
        name: "Prohibir algoritmos criptográficos rotos (MD5, SHA-1, DES)"
        pattern_scan:
          paths: ["**/*.kt", "**/*.java"]
          exclude: ["**/test/**", "**/androidTest/**"]
          forbid_regex: '(?i)getInstance\s*\(\s*["''](MD5|SHA-?1|DES|RC4|AES/ECB)[^"'']*["'']\)'
          message: "Algoritmo criptográfico inseguro o modo ECB detectado (OWASP M10)"
